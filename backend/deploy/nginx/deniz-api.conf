# nginx in front of the Deniz API.
#
# Before use, replace (the guide does it with sed):
#   api.example.ir          → the API's domain
#   /home/arvin/deniz-api   → the project folder on the server
#
# Install:
#   sudo cp deploy/nginx/deniz-api.conf /etc/nginx/sites-available/deniz-api
#   sudo ln -s /etc/nginx/sites-available/deniz-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.example.ir     # adds HTTPS and the http → https redirect to this file
#
# The API listens on 127.0.0.1:3000 only; everything from outside goes through here.

upstream deniz_api {
	server 127.0.0.1:3000;
	# reuse connections to Node (Node keeps them 65 s, longer than nginx's 60 s, see src/server.ts)
	keepalive 16;
}

server {
	listen 80;
	# IPv6 too, if the server has it (nginx refuses to start with this line on a server without IPv6):
	# listen [::]:80;
	server_name api.example.ir;

	# uploads are at most 5 MB (src/lib/uploads.ts); a little room for the multipart envelope
	client_max_body_size 6m;
	server_tokens off;

	# Product and banner images straight from disk: faster than Node, and they never touch the API.
	# Names are random and never reused, so they can be cached for a long time.
	location ^~ /uploads/ {
		# /uploads/… maps to <project>/uploads/… (root, not alias: alias + try_files has known nginx pitfalls)
		root /home/arvin/deniz-api;
		# only the two image folders, only image files, no listings, no hidden files
		location ~ ^/uploads/(products|banners)/[^/]+\.(jpg|png|webp|gif)$ {
			expires 30d;
			add_header X-Content-Type-Options "nosniff" always;
			# the frontend may be on another domain
			add_header Cross-Origin-Resource-Policy "cross-origin" always;
			try_files $uri =404;
		}
		return 404;
	}

	location ^~ /api/ {
		proxy_pass http://deniz_api;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		# the API compares Origin with this address (CSRF guard) and logs the real client IP
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		# replaced, not appended: a client cannot slip a fake IP past the rate limits (TRUST_PROXY=1)
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 60s;
		proxy_send_timeout 60s;
	}

	location = /health {
		proxy_pass http://deniz_api;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		access_log off;
	}

	# nothing else lives on this domain
	location / {
		return 404;
	}
}
